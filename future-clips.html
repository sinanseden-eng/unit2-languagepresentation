<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Tenses · Puppet Films</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:#15384b;font:16px/1.5 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:clamp(14px,3vw,28px)}header{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}h1{font:700 clamp(1.5rem,3vw,2.25rem)/1.1 Georgia,serif;margin:.4rem 0}.eyebrow{margin:0;font-size:.85rem;letter-spacing:.1em;font-weight:800;text-transform:uppercase}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:700 1rem system-ui;padding:.6rem .8rem;border:1px solid #7595a7;border-radius:7px;background:white;color:#123d54;min-height:44px;cursor:pointer}button[aria-pressed=true]{background:#173e54;color:white}button:focus-visible,a:focus-visible{outline:3px solid #d57723;outline-offset:3px}.screen{background:#142c3c;border-radius:12px;overflow:hidden;margin-top:18px}video{display:block;width:100%;aspect-ratio:7/4;background:#152b39}.note{padding:.6rem 1rem;background:#dcebf5;margin:0;font-size:.9rem}#question{background:#fff;border-left:4px solid #e5aa35;padding:.75rem 1rem;margin:1rem 0}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.actions a{color:#145374}small{font-size:.9rem}mark{background:#ffe37c;color:#192d39;padding:0 .15em}#examples{padding:0 1.4rem}#examples li{margin:.4em 0}
</style></head><body><main>
<header><div><p class="eyebrow">Unit 2 · School fair films</p><h1 id="title"></h1></div><nav aria-label="Choose a film"><button type="button" data-film="hall">In progress or finished?</button><button type="button" data-film="hour">How long?</button></nav></header>
<div class="screen"><video id="film" controls playsinline preload="metadata" aria-label="Captioned grammar puppet film"></video><p class="note">English subtitles and yellow grammar highlights are part of this video. Use the player to pause, replay or show it full screen.</p></div>
<p id="question"></p><div class="actions"><button id="replay">Replay from the start</button><a id="download" download>Download this clip</a></div>
<details><summary>Read the target sentences</summary><ul id="examples"></ul></details>
</main><script>
(()=>{
 const clips={
 hall:{title:'Can we use the hall?',file:'assets/can-we-use-the-hall.mp4',poster:'assets/hall-poster.jpg',question:'At 4:30, is the work in progress or finished? By six, is the hall ready?',examples:['We<mark>’ll be packing away</mark> the stalls.','By six, we<mark>’ll have packed</mark> them all away.']},
 hour:{title:'How long?',file:'assets/how-long.mp4',poster:'assets/hour-poster.jpg',question:'Packing starts at four. By five, how long will they have been packing? Must the work be finished?',examples:['By five, we<mark>’ll have been packing</mark> for an hour.']}
 };
 const video=document.getElementById('film');
 function select(key){const c=clips[key];video.pause();video.src=c.file;video.poster=c.poster;video.load();document.getElementById('title').textContent=c.title;document.getElementById('question').textContent='Discuss: '+c.question;document.getElementById('download').href=c.file;document.getElementById('examples').innerHTML=c.examples.map(t=>'<li>'+t+'</li>').join('');document.querySelectorAll('[data-film]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.film===key)));video.setAttribute('aria-label',c.title+' — captioned puppet film')}
 document.querySelectorAll('[data-film]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.film)));
 document.getElementById('replay').onclick=()=>{video.currentTime=0;video.play().catch(()=>{})};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)video.pause()});window.addEventListener('pagehide',()=>video.pause());
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&parent!==window)parent.postMessage('future-fair:close',location.origin)});
 select(new URLSearchParams(location.search).get('clip')==='hour'?'hour':'hall');
})();
</script></body></html>
