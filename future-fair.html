function start(restart=false){if(restart||t>=15)t=0;playing=true;last=null;cancelAnimationFrame(raf);track.muted=!audioOn;if(track.readyState>0)track.currentTime=t;track.play().catch(()=>{$('audioNote').textContent='Audio could not play. Check your browser’s sound settings or follow the captions.'});render();raf=requestAnimationFrame(frame)}
function select(id){pause();key=id;track.src=tracks[id];$('audioNote').textContent='';t=0;spoken=-1;const d=scenes[key];$('title').textContent=key+' · '+d[0];$('desc').textContent=d[7];$('prompt').textContent='Discuss: '+d[5];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',String(b.textContent===id)));render()}
$('world').innerHTML='<rect width="800" height="298" fill="#d5e7e4"/><rect width="800" height="215" fill="url(#wall)"/><path d="M0 213h800v85H0z" fill="#eac998"/><path d="M0 214h800m-800 51h800m-682-51-40 84m234-84-12 84m210-84 26 84m170-84 50 84" fill="none" stroke="#bb956e" stroke-width="2" opacity=".55"/><rect x="60" y="69" width="85" height="143" rx="3" fill="#74919a" stroke="#436575" stroke-width="4"/><rect x="73" y="83" width="56" height="60" rx="2" fill="#bed8d9"/><circle cx="129" cy="164" r="4" fill="#fed28a"/><path d="M0 5q347 68 800-3" fill="none" stroke="#596f70" stroke-width="3"/>'+Array.from({length:16},(_,i)=>{const x=i*52,y=5+30*Math.sin(Math.PI*x/800);return '<path d="m'+x+' '+y+' 24 3-13 19z" fill="'+['#c76858','#efb452','#50858d'][i%3]+'"/>'}).join('');
for(const id of Object.keys(scenes)){const b=document.createElement('button');b.textContent=id;b.setAttribute('aria-label','Scene '+id+': '+scenes[id][0]);b.onclick=()=>select(id);document.querySelector('nav').append(b)}
$('play').onclick=()=>playing?pause():start();$('replay').onclick=()=>{pause();start(true)};
$('voice').onclick=()=>{audioOn=!audioOn;track.muted=!audioOn;$('voice').textContent='Voice: '+(audioOn?'on':'off');$('voice').setAttribute('aria-pressed',String(audioOn))};
$('subs').onclick=()=>{captions=!captions;$('subs').setAttribute('aria-pressed',String(captions));$('subs').textContent='Captions: '+(captions?'on':'off');render()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('pagehide',pause);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&parent!==window)parent.postMessage('future-fair:close',location.origin==='null'?'*':location.origin)});
const initial=new URLSearchParams(location.search).get('scene');select(Object.hasOwn(scenes,initial)?initial:'S');
</script></body></html>
